<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>CareerPilotAI - Interviews</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        body {
            background: #f5f7ff;
            font-family: Arial, sans-serif;
        }

        .sidebar {

            min-height: 100vh;

            background:
                    linear-gradient(
                            180deg,
                            #312e81,
                            #4f46e5,
                            #6366f1
                    );

            color: white;

            padding: 25px 18px;
        }

        .brand {

            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .admin-badge {

            background: rgba(255,255,255,.15);

            padding: 10px;

            border-radius: 12px;

            margin-bottom: 25px;
        }

        .sidebar a {

            color: white;

            text-decoration: none;

            display: block;

            padding: 13px 15px;

            border-radius: 12px;

            margin-bottom: 8px;

            transition: .3s;
        }

        .sidebar a:hover,
        .sidebar a.active {

            background: rgba(255,255,255,.18);

            transform: translateX(4px);
        }

        .topbar {

            background: white;

            padding: 18px 25px;

            border-radius: 18px;

            box-shadow:
                    0 5px 20px rgba(0,0,0,.06);

            margin-bottom: 25px;
        }

        .content-card {

            background: white;

            border: none;

            border-radius: 20px;

            box-shadow:
                    0 8px 25px rgba(0,0,0,.06);
        }

        .table {

            vertical-align: middle;
        }

        .table thead {

            background: #f8f7ff;
        }

        .table thead th {

            color: #4b5563;

            font-size: 14px;

            border-bottom: none;

            padding: 16px;

            white-space: nowrap;
        }

        .table tbody td {

            padding: 16px;

            white-space: nowrap;
        }

        .technology-badge {

            padding: 7px 12px;

            border-radius: 20px;

            background: #ede9fe;

            color: #6d28d9;

            font-weight: 600;

            font-size: 12px;
        }

        .difficulty-badge {

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;
        }

        .beginner {

            background: #dcfce7;

            color: #15803d;
        }

        .intermediate {

            background: #fef3c7;

            color: #a16207;
        }

        .advanced {

            background: #fee2e2;

            color: #b91c1c;
        }

        .status-badge {

            padding: 7px 12px;

            border-radius: 20px;

            background: #dcfce7;

            color: #15803d;

            font-size: 12px;

            font-weight: 600;
        }

        .score {

            font-weight: bold;

            color: #4f46e5;
        }

        .empty-state {

            padding: 60px;

            text-align: center;

            color: #6b7280;
        }

        .search-box {

            max-width: 300px;
        }

    </style>

</head>


<body>

<div class="container-fluid">

    <div class="row">


        <!-- SIDEBAR -->

        <div class="col-md-2 sidebar">

            <div class="brand text-center">

                🚀 CareerPilotAI

            </div>


            <div class="admin-badge text-center">

                <i class="fa-solid fa-user-shield me-2"></i>

                Administrator

            </div>


            <a href="admin-dashboard.html">

                <i class="fa-solid fa-chart-pie me-2"></i>

                Dashboard

            </a>


            <a href="admin-users.html">

                <i class="fa-solid fa-users me-2"></i>

                Users

            </a>


            <a href="admin-interviews.html"
               class="active">

                <i class="fa-solid fa-robot me-2"></i>

                Interviews

            </a>


            <a href="#">

                <i class="fa-solid fa-file-lines me-2"></i>

                Resumes

            </a>


            <a href="#">

                <i class="fa-solid fa-chart-line me-2"></i>

                Analytics

            </a>


            <a href="dashboard.html">

                <i class="fa-solid fa-graduation-cap me-2"></i>

                Student Portal

            </a>


            <a href="/logout">

                <i class="fa-solid fa-right-from-bracket me-2"></i>

                Logout

            </a>

        </div>


        <!-- MAIN CONTENT -->

        <div class="col-md-10 p-4">


            <div class="topbar">

                <h4 class="mb-1">

                    Interview Management 🤖

                </h4>

                <p class="text-muted mb-0">

                    Monitor completed AI interviews and scores.

                </p>

            </div>


            <div class="card content-card">

                <div class="card-body p-4">


                    <div class="d-flex
                                justify-content-between
                                align-items-center
                                flex-wrap
                                gap-3
                                mb-4">

                        <div>

                            <h5 class="mb-1">

                                Interview Records

                            </h5>

                            <small class="text-muted">

                                All completed interviews

                            </small>

                        </div>


                        <div class="input-group search-box">

                            <span class="input-group-text">

                                <i class="fa-solid fa-search"></i>

                            </span>

                            <input
                                    type="text"
                                    id="searchInput"
                                    class="form-control"
                                    placeholder="Search..."
                            >

                        </div>

                    </div>


                    <div class="table-responsive">

                        <table class="table">

                            <thead>

                            <tr>

                                <th>ID</th>

                                <th>Technology</th>

                                <th>Difficulty</th>

                                <th>Questions</th>

                                <th>Score</th>

                                <th>Status</th>

                                <th>Date</th>

                            </tr>

                            </thead>


                            <tbody id="interviewsTable">

                            <tr>

                                <td
                                        colspan="7"
                                        class="text-center p-5">

                                    <div
                                            class="spinner-border text-primary">
                                    </div>

                                    <p class="mt-3">

                                        Loading interviews...

                                    </p>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    let allInterviews = [];


    async function loadInterviews() {

        try {

            const response =
                await fetch(
                    "/api/admin/interviews"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load interviews"
                );

            }


            allInterviews =
                await response.json();


            displayInterviews(
                allInterviews
            );

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "interviewsTable"
            ).innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty-state">

                    <i
                        class="fa-solid
                               fa-triangle-exclamation
                               fa-2x
                               text-danger">
                    </i>

                    <h5 class="mt-3">

                        Unable to load interviews

                    </h5>

                    <p>

                        Please check your
                        authentication and server.

                    </p>

                </td>

            </tr>

        `;

        }

    }


    function displayInterviews(
        interviews
    ) {

        const table =
            document.getElementById(
                "interviewsTable"
            );


        if (interviews.length === 0) {

            table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty-state">

                    <i
                        class="fa-solid
                               fa-robot
                               fa-2x">
                    </i>

                    <h5 class="mt-3">

                        No interviews found

                    </h5>

                    <p>

                        Completed interviews
                        will appear here.

                    </p>

                </td>

            </tr>

        `;

            return;
        }


        table.innerHTML =
            interviews.map(
                interview => {

                    const difficulty =
                        (
                            interview.difficulty
                            || ""
                        ).toLowerCase();


                    let difficultyClass =
                        "beginner";


                    if (
                        difficulty ===
                        "intermediate"
                    ) {

                        difficultyClass =
                            "intermediate";

                    }


                    if (
                        difficulty ===
                        "advanced"
                    ) {

                        difficultyClass =
                            "advanced";

                    }


                    const date =
                        interview.interviewDate
                            ? new Date(
                                interview.interviewDate
                            ).toLocaleString()
                            : "-";


                    return `

                    <tr>

                        <td>

                            <strong>
                                #${interview.id}
                            </strong>

                        </td>


                        <td>

                            <span
                                class="technology-badge">

                                ${interview.technology}

                            </span>

                        </td>


                        <td>

                            <span
                                class="difficulty-badge
                                       ${difficultyClass}">

                                ${interview.difficulty}

                            </span>

                        </td>


                        <td>

                            ${interview.totalQuestions}

                        </td>


                        <td>

                            <span
                                class="score">

                                ${interview.score}

                            </span>

                        </td>


                        <td>

                            <span
                                class="status-badge">

                                ${interview.status}

                            </span>

                        </td>


                        <td>

                            ${date}

                        </td>

                    </tr>

                `;

                }
            ).join("");

    }


    // SEARCH

    document.getElementById(
        "searchInput"
    ).addEventListener(
        "input",
        function () {

            const keyword =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                allInterviews.filter(
                    interview =>

                        (
                            interview.technology
                            || ""
                        )
                            .toLowerCase()
                            .includes(keyword)

                        ||

                        (
                            interview.difficulty
                            || ""
                        )
                            .toLowerCase()
                            .includes(keyword)

                        ||

                        (
                            interview.status
                            || ""
                        )
                            .toLowerCase()
                            .includes(keyword)
                );


            displayInterviews(
                filtered
            );

        }
    );


    loadInterviews();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CareerPilotAI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        body{
            background:#f4f7fb;
        }

        .sidebar{
            background:#1e293b;
            height:100vh;
            color:white;
            padding:20px;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:12px;
            border-radius:8px;
            margin-bottom:8px;
        }

        .sidebar a:hover{
            background:#334155;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .card:hover{
            transform:translateY(-5px);
            transition:.3s;
        }

        .topbar{
            background:white;
            padding:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 sidebar">

            <h3 class="text-center mb-4">
                CareerPilotAI
            </h3>

            <a href="#"><i class="fa fa-home"></i> Dashboard</a>

            <a href="#"><i class="fa fa-robot"></i> AI Interview</a>

            <a href="#"><i class="fa fa-file"></i> Resume</a>

            <a href="#"><i class="fa fa-chart-line"></i> Progress</a>

            <a href="#"><i class="fa fa-history"></i> History</a>

            <a href="#"><i class="fa fa-user"></i> Profile</a>

            <a href="login.html"><i class="fa fa-right-from-bracket"></i> Logout</a>

        </div>

        <div class="col-md-10">

            <div class="topbar">

                <h4>Welcome to CareerPilotAI 👋</h4>

                <p>Your AI Powered Interview Preparation Platform</p>

            </div>

            <div class="container mt-4">

                <div class="row">

                    <div class="col-md-3 mb-4">

                        <div class="card shadow">

                            <div class="card-body text-center">

                                <h1>🤖</h1>

                                <h5>AI Interview</h5>

                                <a href="/interview.html" class="btn btn-primary">
                                    Start AI Interview
                                </a>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3 mb-4">

                        <div class="card shadow">

                            <div class="card-body text-center">

                                <h1>📄</h1>

                                <h5>Resume</h5>

                                <a href="/resume.html" class="btn btn-success">
                                    Upload
                                </a>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3 mb-4">

                        <div class="card shadow">

                            <div class="card-body text-center">

                                <h1>📊</h1>

                                <h5>Progress</h5>

                                <a href="progress.html"
                                   class="btn btn-warning">

                                    View

                                </a>
                            </div>star

                        </div>

                    </div>

                    <div class="col-md-3 mb-4">

                        <div class="card shadow">

                            <div class="card-body text-center">

                                <h1>📚</h1>

                                <h5>History</h5>

                                <a href="/history.html" class="btn btn-info">
                                    Open
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

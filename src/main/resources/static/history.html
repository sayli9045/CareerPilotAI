<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Interview History | CareerPilotAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="sticker one">📚</div>
<div class="sticker two">🎓</div>
<div class="sticker three">💻</div>

<div class="page-container">

    <div class="page-header">

        <h2>
            📚 Interview History
        </h2>

        <p class="text-muted mb-0">
            Review your previous interview performance.
        </p>

    </div>


    <div class="modern-card">

        <div class="table-responsive">

            <table class="table modern-table">

                <thead>

                <tr>

                    <th>Technology</th>
                    <th>Difficulty</th>
                    <th>Score</th>
                    <th>Status</th>
                    <th>Date</th>

                </tr>

                </thead>

                <tbody id="historyTable">

                </tbody>

            </table>

        </div>

        <a href="dashboard.html"
           class="btn btn-gradient mt-3">

            ← Dashboard

        </a>

    </div>

</div>


<script>

    async function loadHistory() {

        try {

            const response = await fetch(
                "http://localhost:8081/api/interview/history"
            );

            const interviews = await response.json();

            let rows = "";

            interviews.forEach(interview => {

                rows += `

            <tr>

                <td>
                    💻 ${interview.technology}
                </td>

                <td>
                    ${interview.difficulty}
                </td>

                <td>

                    <span class="badge rounded-pill text-bg-primary">

                        ${interview.score}

                    </span>

                </td>

                <td>

                    <span class="badge rounded-pill text-bg-success">

                        ✓ ${interview.status}

                    </span>

                </td>

                <td>
                    ${interview.interviewDate}
                </td>

            </tr>

            `;

            });

            document.getElementById("historyTable").innerHTML = rows;

        } catch(error) {

            console.error(error);

            alert("Unable to load interview history.");

        }

    }

    loadHistory();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>AI Interview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                AI Interview
            </h2>

            <div class="mb-3">

                <label>Technology</label>

                <select id="technology" class="form-select">

                    <option>Java</option>
                    <option>Python</option>
                    <option>DevOps</option>

                </select>

            </div>

            <div class="mb-3">

                <label>Difficulty</label>

                <select id="difficulty" class="form-select">

                    <option>Beginner</option>
                    <option>Intermediate</option>
                    <option>Advanced</option>

                </select>

            </div>

            <button
                    class="btn btn-primary"
                    onclick="startInterview()">

                Start Interview

            </button>

            <hr>

            <div id="questions"></div>

        </div>

    </div>

</div>

<script>

    async function startInterview(){

        const request={

            technology:document.getElementById("technology").value,
            difficulty:document.getElementById("difficulty").value

        };

        const response=await fetch("http://localhost:8081/api/interview/start",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(request)

        });

        const questions=await response.json();

        let html="";

        questions.forEach((q,index)=>{

            html+=`
            <div class="card mt-3">
                <div class="card-body">

                    <h5>Question ${index+1}</h5>

                    <p>${q}</p>

                    <textarea
                        class="form-control"
                        rows="3"
                        placeholder="Write your answer here"></textarea>

                </div>
            </div>
        `;

        });

        html+=`
        <button
        class="btn btn-success mt-3"
        onclick="submitInterview()">

    Submit Interview

</button>
    `;

        document.getElementById("questions").innerHTML=html;

    }
    async function submitInterview() {

        const answers = [];

        document.querySelectorAll("textarea").forEach(textarea => {

            answers.push(textarea.value);

        });

        const request = {

            technology: document.getElementById("technology").value,
            difficulty: document.getElementById("difficulty").value,
            answers: answers

        };

        const response = await fetch(
            "http://localhost:8081/api/interview/submit",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(request)

            });
        console.log(response.status);
        console.log(response.url);

        const score = await response.text();

        alert("Interview Submitted Successfully!\n\nScore : " + score);

        window.location.href = "dashboard.html";

    }

</script>

</body>
</html>

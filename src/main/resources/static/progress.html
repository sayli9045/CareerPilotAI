<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Progress Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fb;
        }

        .card{
            border:none;
            border-radius:15px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-5">
        Progress Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h1>📚</h1>

                    <h5>Total Interviews</h5>

                    <h2 id="totalInterviews">0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h1>⭐</h1>

                    <h5>Average Score</h5>

                    <h2 id="averageScore">0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h1>🏆</h1>

                    <h5>Highest Score</h5>

                    <h2 id="highestScore">0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h1>📉</h1>

                    <h5>Lowest Score</h5>

                    <h2 id="lowestScore">0</h2>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="dashboard.html"
           class="btn btn-primary">

            Back to Dashboard

        </a>

    </div>

</div>

<script>

    async function loadProgress(){

        const response = await fetch(
            "http://localhost:8081/api/interview/progress"
        );

        const progress = await response.json();

        document.getElementById("totalInterviews").innerText =
            progress.totalInterviews;

        document.getElementById("averageScore").innerText =
            Number(progress.averageScore).toFixed(1);

        document.getElementById("highestScore").innerText =
            progress.highestScore;

        document.getElementById("lowestScore").innerText =
            progress.lowestScore;

    }

    loadProgress();

</script>

</body>
</html>

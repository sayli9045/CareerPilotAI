<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>CareerPilotAI - Users</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        body {
            background: #f5f7ff;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            min-height: 100vh;

            background:
                    linear-gradient(
                            180deg,
                            #312e81,
                            #4f46e5,
                            #6366f1
                    );

            color: white;

            padding: 25px 18px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .admin-badge {
            background: rgba(255,255,255,.15);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 13px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: .3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255,255,255,.18);
            transform: translateX(4px);
        }

        .topbar {
            background: white;
            padding: 18px 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
            margin-bottom: 25px;
        }

        .content-card {
            background: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,.06);
        }

        .table {
            vertical-align: middle;
        }

        .table thead {
            background: #f8f7ff;
        }

        .table thead th {
            color: #4b5563;
            font-size: 14px;
            border-bottom: none;
            padding: 16px;
        }

        .table tbody td {
            padding: 16px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #ede9fe;
            color: #6d28d9;

            font-weight: bold;
            margin-right: 10px;
        }

        .role-badge {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .student-role {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .admin-role {
            background: #ede9fe;
            color: #7c3aed;
        }

        .search-box {
            max-width: 320px;
        }

        .empty-state {
            padding: 60px;
            text-align: center;
            color: #6b7280;
        }

        .loading {
            padding: 50px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-md-2 sidebar">

            <div class="brand text-center">
                🚀 CareerPilotAI
            </div>

            <div class="admin-badge text-center">

                <i class="fa-solid fa-user-shield me-2"></i>

                Administrator

            </div>

            <a href="admin-dashboard.html">

                <i class="fa-solid fa-chart-pie me-2"></i>

                Dashboard

            </a>

            <a href="admin-users.html"
               class="active">

                <i class="fa-solid fa-users me-2"></i>

                Users

            </a>

            <a href="#">

                <i class="fa-solid fa-robot me-2"></i>

                Interviews

            </a>

            <a href="#">

                <i class="fa-solid fa-file-lines me-2"></i>

                Resumes

            </a>

            <a href="#">

                <i class="fa-solid fa-chart-line me-2"></i>

                Analytics

            </a>

            <a href="dashboard.html">

                <i class="fa-solid fa-graduation-cap me-2"></i>

                Student Portal

            </a>

            <a href="/logout">

                <i class="fa-solid fa-right-from-bracket me-2"></i>

                Logout

            </a>

        </div>


        <!-- MAIN CONTENT -->

        <div class="col-md-10 p-4">

            <div class="topbar">

                <h4 class="mb-1">

                    User Management 👥

                </h4>

                <p class="text-muted mb-0">

                    View and manage registered CareerPilotAI users.

                </p>

            </div>


            <div class="card content-card">

                <div class="card-body p-4">

                    <div class="d-flex
                                justify-content-between
                                align-items-center
                                flex-wrap
                                gap-3
                                mb-4">

                        <div>

                            <h5 class="mb-1">

                                Registered Users

                            </h5>

                            <small class="text-muted">

                                All users registered on the platform

                            </small>

                        </div>


                        <div class="input-group search-box">

                            <span class="input-group-text">

                                <i class="fa-solid fa-search"></i>

                            </span>

                            <input
                                    type="text"
                                    id="searchInput"
                                    class="form-control"
                                    placeholder="Search users..."
                            >

                        </div>

                    </div>


                    <!-- TABLE -->

                    <div class="table-responsive">

                        <table class="table">

                            <thead>

                            <tr>

                                <th>ID</th>

                                <th>User</th>

                                <th>Email</th>

                                <th>Role</th>

                                <th>Registered</th>
                                <th>Action</th>

                            </tr>

                            </thead>

                            <tbody id="usersTable">

                            <tr>

                                <td
                                        colspan="6"
                                        class="loading">

                                    <div
                                            class="spinner-border text-primary">
                                    </div>

                                    <p class="mt-3 mb-0">

                                        Loading users...

                                    </p>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    let allUsers = [];


    async function loadUsers() {

        try {

            const response =
                await fetch("/api/admin/users");


            if (!response.ok) {

                throw new Error(
                    "Unable to access users API"
                );

            }


            allUsers =
                await response.json();


            displayUsers(allUsers);

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "usersTable"
            ).innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty-state">

                    <i
                        class="fa-solid
                               fa-triangle-exclamation
                               fa-2x
                               text-danger">
                    </i>

                    <h5 class="mt-3">

                        Unable to load users

                    </h5>

                    <p>

                        Please check your
                        authentication and server.

                    </p>

                </td>

            </tr>

        `;

        }

    }


    function displayUsers(users) {

        const table =
            document.getElementById(
                "usersTable"
            );


        if (users.length === 0) {

            table.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty-state">

                    <i
                        class="fa-solid
                               fa-users-slash
                               fa-2x">
                    </i>

                    <h5 class="mt-3">

                        No users found

                    </h5>

                </td>

            </tr>

        `;

            return;
        }


        table.innerHTML =
            users.map(user => {

                const initial =
                    user.fullName
                        ? user.fullName
                            .charAt(0)
                            .toUpperCase()
                        : "?";


                const roleClass =
                    user.role === "ADMIN"
                        ? "admin-role"
                        : "student-role";


                const date =
                    user.createdAt
                        ? new Date(
                            user.createdAt
                        ).toLocaleDateString()
                        : "-";


                return `

                <tr>

                    <td>

                        <strong>
                            #${user.id}
                        </strong>

                    </td>


                    <td>

                        <div class="d-flex
                                    align-items-center">

                            <span
                                class="user-avatar">

                                ${initial}

                            </span>

                            <strong>

                                ${user.fullName}

                            </strong>

                        </div>

                    </td>


                    <td>

                        ${user.email}

                    </td>


                    <td>

                        <span
                            class="role-badge
                                   ${roleClass}">

                            ${user.role}

                        </span>

                    </td>


                   <td>

    ${date}

</td>

<td>

    <button
        class="btn btn-sm btn-outline-primary"
        onclick="viewUser(${user.id})">

        <i class="fa-solid fa-eye"></i>

        View

    </button>

</td>

                </tr>

            `;

            }).join("");

    }


    // SEARCH

    document.getElementById(
        "searchInput"
    ).addEventListener(
        "input",
        function () {

            const keyword =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                allUsers.filter(user =>

                    (user.fullName || "")
                        .toLowerCase()
                        .includes(keyword)

                    ||

                    (user.email || "")
                        .toLowerCase()
                        .includes(keyword)

                    ||

                    (user.role || "")
                        .toLowerCase()
                        .includes(keyword)
                );


            displayUsers(filtered);

        }
    );
    async function viewUser(id) {

        try {

            const response =
                await fetch(
                    `/api/admin/users/${id}`
                );

            if (!response.ok) {

                throw new Error(
                    "Unable to load user details"
                );

            }

            const user =
                await response.json();

            alert(
                "User Details\n\n" +
                "ID: " + user.id + "\n" +
                "Name: " + user.fullName + "\n" +
                "Email: " + user.email + "\n" +
                "Role: " + user.role + "\n" +
                "Registered: " +
                new Date(
                    user.createdAt
                ).toLocaleString()
            );

        } catch (error) {

            console.error(error);

            alert(
                "Unable to load user details."
            );
        }
    }

    loadUsers();

</script>

</body>

</html>
